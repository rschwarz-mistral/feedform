<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feed Form</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <!-- PyScript with MicroPython backend -->
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
    <!-- Register service worker for offline functionality -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Feed Form</h1>
            <p class="subtitle">Offline Data Entry</p>
        </header>

        <main>
            <form id="entry-form" class="form">
                <div class="form-group">
                    <label for="timestamp">Timestamp</label>
                    <input type="datetime-local" id="timestamp" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="material">Material</label>
                    <select id="material" class="form-control" required>
                        <option value="">-- Select Material --</option>
                    </select>
                </div>

                <div class="scale-readings">
                    <h3>Scale Readings (kg)</h3>
                    <div id="scale-fields" class="scale-fields"></div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" class="form-control" rows="2"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="save-btn" class="btn btn-primary">
                        Save Entry
                    </button>
                    <button type="button" id="clear-btn" class="btn btn-secondary">
                        Clear Form
                    </button>
                </div>
            </form>

            <div class="divider"></div>

            <section class="export-section">
                <h2>Data Export</h2>
                <div class="export-info">
                    <p>Records stored: <span id="record-count">0</span></p>
                </div>
                <button type="button" id="export-btn" class="btn btn-export">
                    Export CSV
                </button>
                <button type="button" id="clear-all-btn" class="btn btn-danger">
                    Clear All Data
                </button>
            </section>

            <div class="status-bar" id="status-bar"></div>
        </main>
    </div>

    <!-- PyScript configuration -->
    <py-config>
        backend = "micropython"
        paths = [".", "/"]
    </py-config>

    <!-- Main application logic -->
    <py-script src="main.py"></py-script>
</body>
</html>
